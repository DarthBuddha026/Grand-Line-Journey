<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#082541" />
    <title>Grand Line Survivor</title>
    <meta name="description" content="A free, unofficial One Piece fan game: pick your captain, survive 20 minutes of Marines and pirates, and earn a bounty worth bragging about. Plays in the browser." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Link previews (Discord, Facebook, X, Messenger...). VITE_SITE_URL (.env) makes the image link absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Grand Line Survivor" />
    <meta property="og:title" content="Grand Line Survivor: The ONE PIECE is REAL!" />
    <meta property="og:description" content="Pick your captain, survive the Grand Line and earn a bounty worth bragging about. Free in your browser." />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grand Line Survivor title screen: the logo over a cel-shaded sea, with Luffy and Koby on deck." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #082541; overflow: hidden; touch-action: none; }
      /* 100dvh avoids the mobile browser toolbar cropping the bottom of the game. */
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: repeating-linear-gradient(135deg, #082541 0 26px, #0b2c4c 26px 52px);
        color: #fffaf0;
        text-align: center;
        font-family: "M PLUS Rounded 1c", "Trebuchet MS", sans-serif;
        font-weight: 800;
        font-size: 18px;
      }
      #rotate .title {
        font-family: "Abril Fatface", Georgia, serif;
        font-size: 30px;
        color: #ffcc33;
        -webkit-text-stroke: 2px #1d1410;
        text-shadow: 4px 4px 0 #e0303a;
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 5px solid #1d1410;
        border-radius: 12px;
        background: #f3e2b8;
        box-shadow: 5px 5px 0 #1d1410;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone { animation: none; transform: rotate(-90deg); }
      }
      /* Phones and tablets held upright: the game is landscape-only. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <div class="title">Turn your device sideways</div>
      <div>Grand Line Survivor plays in landscape.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
